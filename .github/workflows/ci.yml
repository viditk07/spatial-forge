name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - run: python -m pip install -e "apps/backend[dev,vision]"
      - run: python -m ruff format --check apps/backend scripts/collect_release_notices.py
      - run: python -m ruff check apps/backend scripts/collect_release_notices.py
      - run: python -m mypy apps/backend/src
      - run: python -m pytest apps/backend/tests
      - run: python -m build --wheel apps/backend --outdir artifacts/wheel

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/viewer
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/viewer/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/viewer/package-lock.json
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/viewer
      - run: npm run build
        working-directory: apps/viewer
      - run: dotnet restore apps/desktop/SpatialForge.sln
      - run: dotnet format apps/desktop/SpatialForge.sln --verify-no-changes --no-restore
      - run: dotnet build apps/desktop/SpatialForge.sln -c Release --no-restore
      - run: dotnet test apps/desktop/SpatialForge.sln -c Release --no-build --no-restore
